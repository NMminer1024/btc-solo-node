# ============================================================
# Bitcoin Core v28.0 — K230 RockBase 配置
# 默认参数，可按需修改后重启 bitcoind
# ============================================================

# ---- 数据目录 ------------------------------------------------
# 区块数据、链状态、钱包等均存储于此
datadir=/root/block

# ---- 磁盘空间 ------------------------------------------------
# prune=<MB> 仅保留最近 N MB 的区块，自动删除旧数据
# 设为 0 则保存完整区块链（~800GB+，需外接大容量硬盘）
prune=4096

# ---- RPC 服务 (供 ckpool + bitcoin-cli 管理) ---------------
server=1
rpcbind=127.0.0.1
rpcallowip=127.0.0.1

# RPC 认证 — ckpool 用户 (由 share/rpcauth/rpcauth.py ckpool 生成)
rpcauth=ckpool:a0995a2d0ae8cbe6ebcd53c80e772025$01ab7c05deaba5393868f97f25db13d9de8d5ae6dbe3e619d3822aa65cbca034

# ---- 网络 ---------------------------------------------------
# 仅连接 IPv4 (K230 无 IPv6 环境可节省资源)
onlynet=ipv4

# ---- 连接数 -------------------------------------------------
# K230 资源有限，减少最大连接数
maxconnections=20

# ---- 对等节点超时 (秒) --------------------------------------
# 避免因 USB I/O 阻塞导致的网络超时误断
peertimeout=600

# ---- 种子节点 (加速初始发现) -------------------------------
addnode=seed.bitcoin.sipa.be
addnode=dnsseed.bluematt.me
addnode=seed.bitcoinstats.com
addnode=seed.btc.petertodd.net
addnode=dnsseed.bitcoin.dashjr.org
addnode=seed.bitcoin.jonasschnelli.ch
addnode=seed.bitcoin.sprovoost.nl
addnode=dnsseed.emzy.de
addnode=seed.bitcoin.wiz.biz

# ---- 内存池 -------------------------------------------------
# 限制内存池大小 (MB)，防止内存溢出
maxmempool=100

# ---- 日志 ---------------------------------------------------
debuglogfile=/root/bitcoind/debug.log
# 日志级别: 0=安静, 1=标准 (默认)
printtoconsole=0

# ---- 启动时区块验证 ----------------------------------------
# 跳过深度验证以减少 USB 2.0 I/O 瓶颈（参考 Pi5 配置）
checkblocks=1
checklevel=0

# ---- 数据库缓存 (MB) ----------------------------------------
# K230 972MB 内存，450MB 加速 IBD，保守起见不设更高
dbcache=450

# ---- CBC (Compact Block Filters) ----------------------------
# K230 不启用，节省磁盘和 CPU
blockfilterindex=0

# ---- UPnP ---------------------------------------------------
upnp=0

# ---- 监听 ---------------------------------------------------
# 接受入站连接 (完整节点)
listen=1

# ---- 交易索引 ------------------------------------------------
txindex=0

# ---- ZMQ 通知 (供 ckpool 即时收到新区块) ----------------------
zmqpubhashblock=tcp://127.0.0.1:28332
