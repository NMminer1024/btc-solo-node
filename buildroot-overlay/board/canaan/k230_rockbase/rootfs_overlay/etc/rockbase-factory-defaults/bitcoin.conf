# ============================================================
# Bitcoin Core v31.1 — K230 RockBase 配置
# 默认参数，可按需修改后重启 bitcoind
# ============================================================

# ---- 数据目录 ------------------------------------------------
# 区块数据、链状态、钱包等均存储于此
datadir=/root/block

# ---- 磁盘空间 ------------------------------------------------
# prune=<MB> 仅保留最近 N MB 的区块，自动删除旧数据
# 设为 0 则保存完整区块链（~800GB+，需外接大容量硬盘）
prune=4096

# ---- RPC 服务 (供 ckpool + bitcoin-cli 管理) ---------------
server=1
rpcbind=127.0.0.1
rpcallowip=127.0.0.1

# HTTP worker 线程数：31.1 默认 16（多核服务器设计），单核 K230 降到 4。
# 保留多槽位是为了隔离慢 RPC（如 gettxoutsetinfo 分钟级），避免堵住
# ckpool 的 getblocktemplate 导致挖矿中断；设 1 会串行化所有 RPC，不可取。
rpcthreads=4

# RPC 认证 — ckpool 用户 (由 share/rpcauth/rpcauth.py ckpool 生成)
rpcauth=ckpool:a0995a2d0ae8cbe6ebcd53c80e772025$01ab7c05deaba5393868f97f25db13d9de8d5ae6dbe3e619d3822aa65cbca034

# ---- 网络 ---------------------------------------------------
# 仅连接 IPv4 (K230 无 IPv6 环境可节省资源)
onlynet=ipv4
# 使用默认 DNS seeds 做 IPv4 邻居发现，避免手动 addnode 域名触发 IPv6 解析
dnsseed=1

# ---- 连接数 -------------------------------------------------
# K230 资源有限，保持较小连接数以节省内存
# Bitcoin Core 主动外连硬编码上限为 10（8 full-relay + 2 block-relay-only，
# 见 src/net.h MAX_OUTBOUND_FULL_RELAY_CONNECTIONS / MAX_BLOCK_RELAY_ONLY_CONNECTIONS），
# maxconnections 只是总上限；板子已做 8333 端口转发可接受 inbound；
# 出站硬编码占满 10，设 20 给入站留 10 个位置
maxconnections=20

# ---- 对等节点超时 (秒) --------------------------------------
# 60 秒：平衡淘汰落后 peer 的速度与网络延迟容忍度
peertimeout=60

# ---- 节点发现 ------------------------------------------------
# 仅用默认 DNS seeds 做 IPv4 邻居发现（配合上方 dnsseed=1 + onlynet=ipv4）。
# 注意：不要用 addnode 指向 DNS seed 域名。addnode 属于“手动连接”，
# 不受 onlynet=ipv4 限制，会解析这些域名的 AAAA 记录并反复尝试 IPv6
# 连接，在无 IPv6 路由的板子上刷出大量 “Network is unreachable” 报错。


# ---- 内存池 -------------------------------------------------
# 限制内存池大小 (MB)，防止内存溢出
maxmempool=50

# ---- 日志 ---------------------------------------------------
debuglogfile=/root/block/debug.log
# 日志级别: 0=安静, 1=标准 (默认)
printtoconsole=0

# ---- 启动时区块验证 ----------------------------------------
# 跳过深度验证以减少 USB 2.0 I/O 瓶颈（参考 Pi5 配置）
checkblocks=1
checklevel=0

# ---- 数据库缓存 (MB) ----------------------------------------
# K230 SD I/O 较弱，128MB 在内存占用和落盘压力之间更稳妥
dbcache=128

persistmempool=0

# ---- CBC (Compact Block Filters) ----------------------------
# K230 不启用，节省磁盘和 CPU
blockfilterindex=0

# ---- NAT-PMP (端口映射) -------------------------------------
# 30.0 已移除 UPnP；禁用自动端口映射，避免内网节点做不必要的 NAT 请求
natpmp=0

# ---- 监听 ---------------------------------------------------
# 接受入站连接 (完整节点)
listen=1

# ---- 交易索引 ------------------------------------------------
txindex=0

# ---- ZMQ 通知 (供 ckpool 即时收到新区块) ----------------------
zmqpubhashblock=tcp://127.0.0.1:28332
