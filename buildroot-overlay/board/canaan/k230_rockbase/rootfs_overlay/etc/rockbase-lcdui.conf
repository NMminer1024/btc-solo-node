# Rockbase onboard LCD UI
#
# The physical ST7701 panel is 480x800 portrait. The UI renders in an
# 800x480 landscape canvas and uses DRM plane rotation for output.

WIDTH=800
HEIGHT=480
ROTATION=90
LOGO=/usr/share/rockbase-lcdui/boot-logo-800x480.png
STATUS_CACHE=/tmp/status-api.json
MINERS_CACHE=/run/rockbase/miners.json
MINERS_HISTORY_CACHE=/run/rockbase/miners-history-node.json
