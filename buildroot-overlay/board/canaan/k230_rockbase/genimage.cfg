image sysimage-sdcard.img {
	hdimage {
		partition-table-type = "dos"
	}

	partition uboot_spl_1 {
		#512k@1M   0x400@0x800
		in-partition-table = false
		offset = 1M
		image = "uboot/fn_u-boot-spl.bin"
	}
	partition uboot_spl_2 {
		#512k@1.5M   0x800@0xc00
		in-partition-table = false
		offset = 0x180000
		image = "uboot/fn_u-boot-spl.bin"
	}
	partition uboot_env {
		in-partition-table = false
		offset = 0x1e0000
		image = "uboot/env.env"
		size = 0x20000
	}
	partition uboot {
		#1.5m@2M   0xc00@0x1000
		in-partition-table = false
		offset = 2M
		image = "uboot/fn_ug_u-boot.bin"
	}
	partition env {
		#128k@3.5M   0x800@0x1c00
		in-partition-table = false
		offset = 0x380000
		image = "uboot/env.env"
	}

    # partition rtt {
	# 	#20M@10M   0x800@0x800
	# 	offset = 10M
	# 	image = "big-core/rtt_system.bin"
	# 	size = 20M
	# }

	# OTA A/B (stage D): p1=slot_a / p2=slot_b, both written from the same
	# 2G rootfs image (slot_b is the factory copy of slot_a). Each slot is
	# self-contained: /boot/{Image, k.dtb, fw_jump_add_uboot_head.bin} is
	# installed into the rootfs by post-build.sh. No shared boot partition.
	partition slot_a {
		offset = 30M
		partition-type = 0x83
		image = "rootfs.ext4"
	}

	partition slot_b {
		partition-type = 0x83
		image = "rootfs.ext4"
	}

	# User-config partition (A1 v2): survives OTA rootfs swaps AND blockdata
	# re-seeds. Small fixed size, mounted early at /root/config by S05config.
	partition config {
		partition-type = 0x83
		image = "rockcfg.ext4"
	}

	partition blockdata {
		partition-type = 0x83
		image = "blockdata.ext4"
	}

	# partition fat32appfs {
	# 	#offset = 168M
	# 	partition-type = 0xc
	# 	# size = 32M
	# 	image = "app.vfat"
	# }
}
