# ============================================================
# Bitcoin Core v28.0 — K230 RockBase 配置
# 默认参数，可按需修改后重启 bitcoind
# ============================================================

# ---- 数据目录 ------------------------------------------------
# 区块数据、链状态、钱包等均存储于此
datadir=/root/block

# ---- 磁盘空间 (K230 SD 卡容量有限) ---------------------------
# prune=<MB> 仅保留最近 N MB 的区块，自动删除旧数据
# 建议 4096~8192 MB，设为 0 则保存完整区块链（~700GB+）
prune=4096

# ---- RPC 服务 (供 bitcoin-cli 本地管理) -----------------------
server=1
rpcbind=127.0.0.1
rpcallowip=127.0.0.1

# RPC 认证 — 如不设置 cookie 文件自动生成
# rpcauth 格式: rpcauth=<USER>:<SALT>$<HASH>
# 用 ./share/rpcauth/rpcauth.py <username> <password> 生成
# rpcauth=bitcoin:xxxx$xxxx

# ---- 网络 ---------------------------------------------------
# 仅连接 IPv4 (K230 无 IPv6 环境可节省资源)
onlynet=ipv4

# ---- 连接数 -------------------------------------------------
# K230 资源有限，减少最大连接数
maxconnections=20

# ---- 内存池 -------------------------------------------------
# 限制内存池大小 (MB)，防止内存溢出
maxmempool=100

# ---- 日志 ---------------------------------------------------
debuglogfile=/root/bitcoind/debug.log
# 日志级别: 0=安静, 1=标准 (默认)
printtoconsole=0

# ---- 数据库缓存 (MB) ----------------------------------------
# 适中值，K230 内存有限 (默认 450，低于 100 会警告)
dbcache=50

# ---- CBC (Compact Block Filters) ----------------------------
# K230 不启用，节省磁盘和 CPU
blockfilterindex=0

# ---- UPnP ---------------------------------------------------
upnp=0

# ---- 监听 ---------------------------------------------------
# 接受入站连接 (完整节点)
listen=1

# ---- 交易索引 ------------------------------------------------
txindex=0
