{
	/* ===== 上游矿池（必填）===================================
	 * ckpool --proxy 模式：作为代理，将本地矿工的算力
	 * 转发到此上游矿池。格式: 矿池地址:端口
	 */
	"upstream" : "main.ckpool.org:3336",

	/* ===== 比特币地址（必填）===================================
	 * 挖矿收益接收地址
	 */
	"btcaddress" : "18dK8EfyepKuS74fs27iuDJWoGUT4rPto1",

	/* ===== 本地监听地址（可选，默认 3333）=====================
	 * 矿工连接此端口提交算力
	 */
	"serverurl" : [
		"0.0.0.0:3333"
	],

	/* ===== 难度设置（可选）===================================
	 * mindiff  : 最小难度
	 * startdiff : 初始难度
	 * maxdiff   : 最大难度（0 = 无上限）
	 */
	"mindiff" : 1,
	"startdiff" : 2000,
	"maxdiff" : 0,

	/* ===== 贡献比例（可选）===================================
	 * donation : 捐献给 ckpool 开发者的比例（%），默认 0.5
	 */
	"donation" : 0.5,

	/* ===== 日志目录（可选）===================================
	 * ckpool 运行时日志存放路径
	 */
	"logdir" : "/root/ckpool/logs"
}
